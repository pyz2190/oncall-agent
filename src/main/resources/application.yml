server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope settings
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    
    # Enable this block when a Tencent CLS MCP endpoint is available.
    # For local demos the log tool uses mock data, so the placeholder endpoint
    # does not need to be reachable.
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/92XXXXXXXXb4

# DashScope embedding settings
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}
  embedding:
    model: text-embedding-v4

document:
  chunk:
    max-size: 800
    overlap: 100

rag:
  top-k: 3
  model: "qwen3-max"

prometheus:
  base-url: http://localhost:9090
  timeout: 10
  # Keep mock data enabled for repeatable classroom demos.
  # Set to false when connecting to a real Prometheus server.
  mock-enabled: true

cls:
  # Keep mock data enabled unless a Tencent CLS MCP service is configured.
  mock-enabled: true
