server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope settings
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      chat:
        options:
          timeout: 60000
      retry:
        max-attempts: 1
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
    
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: SYNC
        sse:
          connections:
            tencent-cls:
              url: http://localhost:3000
              sse-endpoint: /sse

# DashScope embedding settings
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}
  embedding:
    model: text-embedding-v4

document:
  chunk:
    max-size: 800
    overlap: 100

rag:
  top-k: 3
  model: "qwen3-max"

prometheus:
  base-url: http://localhost:9090
  timeout: 10
  # Keep mock data enabled for repeatable classroom demos.
  # Set to false when connecting to a real Prometheus server.
  mock-enabled: true

cls:
  mock-enabled: false

aiops:
  analysis-timeout-seconds: 75
